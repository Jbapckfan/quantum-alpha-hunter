[pipeline]
lookback_days = 400
intraday = false
max_concurrent = 5

[features]
bb_window = 20
ma_windows = 20,50,200
atr_window = 14
social_delta_window = 7

[universe]
symbols_file = data/universe/initial_universe.csv

[backtest]
initial_capital = 100000
risk_per_trade = 0.02
max_positions = 10
horizon_days = 10
explosion_threshold_equity = 0.50
explosion_threshold_crypto = 0.30

[scoring]
min_samples = 200
cv_folds = 5
calibration_method = isotonic

[signals]
# RZLV signal detection defaults
min_stock_score = 35
min_crypto_score = 15
high_confidence_score = 70
price_min = 0.50
price_max = 50.0
market_cap_min = 50000000
market_cap_max = 30000000000
min_drawdown_pct = 40
min_rally_pct = 15
max_workers = 8

[options]
# Polygon.io options integration
polygon_api_key_env = MARKET_API_KEY
default_universe = SPY,QQQ,AAPL,MSFT,TSLA,SMH,XLF
min_leaps_dte = 270
leaps_min_trend = 0.6
zero_dte_refresh_seconds = 15

[empirical]
# Hedge Fund research-validated settings
vol_zscore_threshold = 2.0
tier1_min_score = 13
tier1_min_drawdown_60d = 55
tier1_max_rsi = 35
fake_out_max_vol = 4.0
falling_knife_max_dd20 = 50
kelly_fraction = 0.25
max_position_pct = 10
min_position_pct = 2
stop_loss_pct = 15
target1_pct = 30
target2_pct = 50
target3_pct = 100

[api]
host = 0.0.0.0
port = 8000
cors_origins = *
