[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-predator"
version = "0.1.0"
description = "Unified multi-asset explosive move detection system"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "yfinance>=0.2.43",
    "praw>=7.7",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "requests>=2.32",
    "plotly>=5.24",
    "streamlit>=1.38",
    "click>=8.0",
    "aiohttp>=3.9",
    "scipy>=1.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
ta = ["ta>=0.11.0"]
dev = ["pytest>=7.0", "black>=23.0", "isort>=5.12", "mypy>=1.0"]

[project.scripts]
apredator = "apredator.cli:main"

[tool.setuptools.packages.find]
include = ["apredator*"]
