[pipeline]
lookback_days = 400
intraday = false
max_concurrent = 5
scan_interval_minutes = 60

[features]
bb_window = 20
ma_windows = 20,50,200
atr_window = 14
social_delta_window = 7

[universe]
symbols_file = data/universe/initial_universe.csv
max_price = 50
min_volume_20d = 100000
min_market_cap = 50000000
max_market_cap = 50000000000
crypto_min_market_cap = 100000000

[backtest]
initial_capital = 100000
risk_per_trade = 0.02
max_positions = 10
horizon_days = 10
explosion_threshold_equity = 0.50
explosion_threshold_crypto = 0.30
profit_target = 0.50
stop_loss = -0.15
max_hold_days = 14

[scoring]
min_samples = 200
cv_folds = 5
calibration_method = isotonic

[alerts]
discord_webhook_url =
cooldown_hours = 4
min_confidence = 0.70
educational_disclaimer = true

[learning]
enabled = true
retrain_interval_days = 30
min_outcome_samples = 50
fp_rate_threshold = 0.40
signal_decay_halflife_days = 90
weight_update_method = bayesian
